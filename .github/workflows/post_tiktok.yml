name: Post tiktok

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in preview mode without posting
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: post-tiktok
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CATEGORY: tiktok
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate posting window
        id: posting_window
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sys.path.append(str(Path.cwd() / "scripts" / "lib"))
          from posting_window import should_run_in_posting_window

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          should_run = should_run_in_posting_window(now)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"should_run={str(should_run).lower()}\n")
              handle.write(f"now_jst={now.isoformat()}\n")
          PY

      - name: Install ffprobe and yt-dlp
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --quiet yt-dlp

      - name: Install runtime dependencies
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install twikit==2.3.3 XClientTransaction==1.0.2 pyyaml

      - name: Load account mode
        id: account_mode
        if: steps.posting_window.outputs.should_run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          def parse_bool(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str) and value.strip().lower() in {"true", "false"}:
                  return value.strip().lower() == "true"
              raise SystemExit("dry_run must be a boolean")

          category = os.environ["CATEGORY"]
          event_name = os.environ["EVENT_NAME"]
          inputs = json.loads(os.environ.get("EVENT_INPUTS_JSON") or "{}") or {}
          raw = yaml.safe_load(Path("config/accounts.yaml").read_text(encoding="utf-8")) or {}
          defaults = raw.get("defaults") or {}
          accounts = raw.get("accounts") or {}
          account = accounts.get(category) or {}
          manual_override = ""
          if event_name == "workflow_dispatch":
              manual_override = str(inputs.get("dry_run", "")).strip().lower()
          if manual_override:
              dry_run = parse_bool(manual_override)
          else:
              dry_run = parse_bool(account.get("dry_run", defaults.get("dry_run", True)))

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"dry_run={str(dry_run).lower()}\n")
          PY

      - name: Prepare runtime directories
        if: steps.posting_window.outputs.should_run == 'true'
        run: mkdir -p tmp/state tmp/runs tmp/tiktok-download

      - name: Restore post state
        if: steps.posting_window.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tmp/state
          key: ${{ runner.os }}-post-tiktok-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-post-tiktok-state-

      - name: Validate secrets for live posting
        if: steps.posting_window.outputs.should_run == 'true' && steps.account_mode.outputs.dry_run != 'true'
        run: |
          if [[ -z "${TWITTER_AUTH_TOKEN:-}" || -z "${TWITTER_CT0:-}" ]]; then
            echo "TWITTER_AUTH_TOKEN and TWITTER_CT0 secrets are required for live video posting." >&2
            exit 1
          fi
          if [[ -z "${TIKTOK_CLIENT_KEY:-}" || -z "${TIKTOK_CLIENT_SECRET:-}" || -z "${TIKTOK_REFRESH_TOKEN:-}" ]]; then
            echo "TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, and TIKTOK_REFRESH_TOKEN secrets are required." >&2
            exit 1
          fi

      - name: Run TikTok pipeline
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          python/.venv/bin/python -c "
          import sys, os, json
          from pathlib import Path

          sys.path.append(str(Path.cwd() / 'scripts' / 'lib'))
          from tiktok_pipeline import run_tiktok_pipeline

          dry_run = '${{ steps.account_mode.outputs.dry_run }}' == 'true'
          result = run_tiktok_pipeline(
              category='${{ env.CATEGORY }}',
              dry_run=dry_run,
              output_dir='tmp',
          )
          result_path = Path('tmp/runs/tiktok-pipeline-result.json')
          result_path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          "

      - name: Write run summary
        if: always()
        env:
          POSTING_WINDOW: ${{ steps.posting_window.outputs.should_run }}
          POSTING_WINDOW_JST: ${{ steps.posting_window.outputs.now_jst }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          result_path = Path("tmp/runs/tiktok-pipeline-result.json")
          posting_window = os.environ.get("POSTING_WINDOW", "")
          posting_window_jst = os.environ.get("POSTING_WINDOW_JST", "")

          lines = ["## post tiktok run", ""]
          lines.append(f"- Posting window: `{posting_window}` (JST: `{posting_window_jst}`)")

          if not result_path.exists():
              lines.append("- Result file was not created.")
          else:
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              data = payload.get("data") or {}
              lines.append(f"- Status: `{'ok' if payload.get('ok') else 'error'}`")
              lines.append(f"- Action: `{data.get('action', '')}`")
              lines.append(f"- Dry run: `{data.get('dry_run', False)}`")
              lines.append(f"- Creator: `{data.get('creator', '')}`")
              lines.append(f"- Video ID: `{data.get('video_id', '')}`")
              lines.append(f"- Candidates fetched: `{data.get('candidates_fetched', 0)}`")
              lines.append(f"- Candidates after filter: `{data.get('candidates_filtered', 0)}`")
              if data.get("post_result"):
                  post = data["post_result"]
                  lines.append(f"- Tweet ID: `{post.get('data', {}).get('id', '')}`")
              if payload.get("message"):
                  lines.append(f"- Message: `{payload['message']}`")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Save post state
        if: always() && steps.posting_window.outputs.should_run == 'true' && steps.account_mode.outputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/state
          key: ${{ runner.os }}-post-tiktok-state-${{ github.run_id }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-run
          path: |
            tmp/runs/
            tmp/state/
          if-no-files-found: ignore
