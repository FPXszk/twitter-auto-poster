name: Evening stock post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip the final twitter post step
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_repost:
        description: Ignore the once-per-day duplicate guard for this manual run
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ignore_market_day:
        description: Allow workflow_dispatch preview even when JPX is closed
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      gainers_count:
        description: Override gainer ranking count for this manual run
        required: false
        default: ""
        type: string
      losers_count:
        description: Override loser ranking count for this manual run
        required: false
        default: ""
        type: string
      max_weighted_length:
        description: Override weighted length cap for this manual run (max 280)
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 9 * * 1-5"

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: evening-stock-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve run options
        id: run_options
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python - <<'PY'
          import json
          import os

          def resolve_input(inputs: dict[str, object], event_name: str, name: str, default: str) -> str:
              if event_name != "workflow_dispatch":
                  return default
              value = inputs.get(name, default)
              if value is None:
                  return default
              return str(value)

          inputs = json.loads(os.environ.get("EVENT_INPUTS_JSON") or "{}") or {}
          event_name = os.environ["EVENT_NAME"]
          values = {
              "dry_run": resolve_input(inputs, event_name, "dry_run", "false"),
              "force_repost": resolve_input(inputs, event_name, "force_repost", "false"),
              "ignore_market_day": resolve_input(inputs, event_name, "ignore_market_day", "false"),
              "gainers_count": resolve_input(inputs, event_name, "gainers_count", ""),
              "losers_count": resolve_input(inputs, event_name, "losers_count", ""),
              "max_weighted_length": resolve_input(inputs, event_name, "max_weighted_length", ""),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for name, value in values.items():
                  handle.write(f"{name}={value}\n")
          PY

      - name: Check JP market day
        id: market_day
        run: python python/check_jpx_business_day.py --github-output

      - name: Log skip reason
        if: steps.market_day.outputs.should_run != 'true' && steps.run_options.outputs.ignore_market_day != 'true'
        run: echo "Skipping evening stock post on ${{ steps.market_day.outputs.target_date }} (${{ steps.market_day.outputs.reason }})"

      - name: Install runtime dependencies
        if: steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true'
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install yfinance pandas twitter-cli pyyaml

      - name: Run runtime diagnostics
        if: steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true'
        run: |
          python/.venv/bin/python python/check_python_runtime.py --module yfinance --module pandas --module yaml --output tmp/evening-runtime.json

      - name: Prepare runtime files
        if: steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true'
        run: |
          mkdir -p tmp
          touch tmp/posted_ids.txt

      - name: Restore post state
        if: steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tmp/posted_ids.txt
          key: ${{ runner.os }}-evening-stock-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-evening-stock-state-

      - name: Restore stock cache
        if: steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python/.venv/bin/python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          repository = "${{ github.repository }}"
          result = subprocess.run(
              [
                  "gh",
                  "run",
                  "list",
                  "--repo",
                  repository,
                  "--workflow",
                  "update_tickers.yml",
                  "--branch",
                  "main",
                  "--status",
                  "success",
                  "--limit",
                  "1",
                  "--json",
                  "databaseId",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          runs = json.loads(result.stdout)
          if not runs:
              raise SystemExit("no successful update_tickers.yml run found")

          subprocess.run(
              [
                  "gh",
                  "run",
                  "download",
                  str(runs[0]["databaseId"]),
                  "--repo",
                  repository,
                  "--name",
                  "stock-cache",
                  "--dir",
                  "tmp",
              ],
              check=True,
          )

          target = Path("tmp/stock_cache.json")
          if not target.is_file():
              raise SystemExit(f"stock_cache.json was not restored to the expected path: {target}")
          PY

      - name: Run evening summary
        if: steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true'
        env:
          DRY_RUN: ${{ steps.run_options.outputs.dry_run }}
          FORCE_REPOST: ${{ steps.run_options.outputs.force_repost }}
          IGNORE_MARKET_DAY: ${{ steps.run_options.outputs.ignore_market_day }}
          GAINERS_COUNT: ${{ steps.run_options.outputs.gainers_count }}
          LOSERS_COUNT: ${{ steps.run_options.outputs.losers_count }}
          MAX_WEIGHTED_LENGTH: ${{ steps.run_options.outputs.max_weighted_length }}
        run: |
          EXTRA_ARGS=""
          if [ "${FORCE_REPOST}" = "true" ]; then
            EXTRA_ARGS="--force-repost"
          fi
          if [ "${IGNORE_MARKET_DAY}" = "true" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --ignore-market-day"
          fi
          if [ -n "${GAINERS_COUNT}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --gainers-count ${GAINERS_COUNT}"
          fi
          if [ -n "${LOSERS_COUNT}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --losers-count ${LOSERS_COUNT}"
          fi
          if [ -n "${MAX_WEIGHTED_LENGTH}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --max-weighted-length ${MAX_WEIGHTED_LENGTH}"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            python/.venv/bin/python python/evening_summary.py --dry-run --cache-path tmp/stock_cache.json --summary-output tmp/evening_summary.json ${EXTRA_ARGS}
          else
            python/.venv/bin/python python/evening_summary.py --cache-path tmp/stock_cache.json --summary-output tmp/evening_summary.json ${EXTRA_ARGS}
          fi

      - name: Write run summary
        if: always()
        env:
          SHOULD_RUN: ${{ steps.market_day.outputs.should_run }}
          TARGET_DATE: ${{ steps.market_day.outputs.target_date }}
          SKIP_REASON: ${{ steps.market_day.outputs.reason }}
          IGNORE_MARKET_DAY: ${{ steps.run_options.outputs.ignore_market_day }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          run_path = Path("tmp/evening_summary.json")
          lines = ["## Evening stock summary", ""]

          if os.environ.get("SHOULD_RUN") != "true" and os.environ.get("IGNORE_MARKET_DAY") != "true":
              lines.extend(
                  [
                      "- Status: `skipped`",
                      f"- JST date: `{os.environ.get('TARGET_DATE', '')}`",
                      f"- Reason: `{os.environ.get('SKIP_REASON', '')}`",
                  ]
              )
          elif not run_path.exists():
              lines.append("summary file was not created.")
          else:
              payload = json.loads(run_path.read_text(encoding="utf-8"))
              lines.extend(
                  [
                      f"- Status: `{payload.get('status', 'unknown')}`",
                       f"- JST date: `{payload.get('date', '')}`",
                       f"- Trade date: `{payload.get('trade_date', '')}`",
                       f"- Variant: `{payload.get('variant', '')}`",
                       f"- Text length: `{payload.get('text_length', '')}`",
                       f"- Max weighted length: `{payload.get('max_weighted_length', '')}`",
                       f"- Gainers count: `{payload.get('gainers_count', '')}`",
                       f"- Losers count: `{payload.get('losers_count', '')}`",
                   ]
               )
              if payload.get("reason"):
                  lines.append(f"- Reason: `{payload.get('reason')}`")
              if payload.get("error"):
                  lines.append(f"- Error: `{payload.get('error')}`")
              if payload.get("expected_trade_date"):
                  lines.append(f"- Expected trade date: `{payload.get('expected_trade_date')}`")
              if payload.get("tweet_id"):
                  lines.append(f"- Tweet ID: `{payload.get('tweet_id')}`")
              if payload.get("tweet_text"):
                  timeline_preview = payload["tweet_text"][:140]
                  lines.extend(
                      [
                          f"- Timeline preview length: `{len(timeline_preview)}`",
                          "",
                          "### Timeline preview (first 140 chars)",
                          "",
                          timeline_preview,
                          "",
                          "### Full text",
                          "",
                          payload["tweet_text"],
                      ]
                  )
              cache_metadata = payload.get("cache_metadata") or {}
              fetch_report = cache_metadata.get("fetch_report") or {}
              skipped_reasons = fetch_report.get("skipped_reasons") or {}
              if skipped_reasons:
                  lines.extend(["", f"- Fetch skipped reasons: `{skipped_reasons}`"])

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Save post state
        if: always() && (steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true')
        uses: actions/cache/save@v4
        with:
          path: tmp/posted_ids.txt
          key: ${{ runner.os }}-evening-stock-state-${{ github.run_id }}

      - name: Upload run artifacts
        if: always() && (steps.market_day.outputs.should_run == 'true' || steps.run_options.outputs.ignore_market_day == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: evening-stock-run
          path: tmp/
          if-no-files-found: ignore
