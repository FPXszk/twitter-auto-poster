name: Twitter account diagnostic

on:
  workflow_dispatch:
    inputs:
      assume_premium:
        description: Assume the account has Premium boost enabled
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      recent_posts_max:
        description: Number of recent posts to inspect for score prediction
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
      tweet_id_1:
        description: First tweet ID to verify
        required: false
        default: ""
        type: string
      tweet_id_2:
        description: Second tweet ID to verify
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: twitter-account-diagnostic
  cancel-in-progress: false

jobs:
  run:
    runs-on:
      - self-hosted
      - Windows
    defaults:
      run:
        shell: pwsh
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Python
        run: |
          $candidates = @(
            "C:\Users\szk\AppData\Local\Programs\Python\Python310\python.exe",
            "C:\Users\szk\miniconda3\python.exe"
          )
          $python = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $python) {
            $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          }
          if (-not $python) {
            throw "Python was not found on PATH."
          }
          "PYTHON_BOOTSTRAP=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version

      - name: Resolve run options
        id: run_options
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          @'
          import json
          import os

          def resolve_input(inputs: dict[str, object], event_name: str, name: str, default: str) -> str:
              if event_name != "workflow_dispatch":
                  return default
              value = inputs.get(name, default)
              if value is None:
                  return default
              return str(value)

          inputs = json.loads(os.environ.get("EVENT_INPUTS_JSON") or "{}") or {}
          event_name = os.environ["EVENT_NAME"]
          values = {
              "assume_premium": resolve_input(inputs, event_name, "assume_premium", "true"),
              "recent_posts_max": resolve_input(inputs, event_name, "recent_posts_max", "10"),
              "tweet_id_1": resolve_input(inputs, event_name, "tweet_id_1", ""),
              "tweet_id_2": resolve_input(inputs, event_name, "tweet_id_2", ""),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for name, value in values.items():
                  handle.write(f"{name}={value}\n")
          '@ | & "$env:PYTHON_BOOTSTRAP" -

      - name: Install runtime dependencies
        run: |
          & "$env:PYTHON_BOOTSTRAP" -m venv python\.venv
          .\python\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\python\.venv\Scripts\python.exe -m pip install twitter-cli tzdata

      - name: Run runtime diagnostics
        run: |
          New-Item -ItemType Directory -Force tmp\diagnostics | Out-Null
          .\python\.venv\Scripts\python.exe python/check_python_runtime.py --output tmp/diagnostics/runtime.json

      - name: Restore score history
        uses: actions/cache/restore@v4
        with:
          path: tmp/diagnostics/account-score-history.jsonl
          key: ${{ runner.os }}-twitter-account-score-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-twitter-account-score-history-

      - name: Run Twitter diagnostics
        env:
          ASSUME_PREMIUM: ${{ steps.run_options.outputs.assume_premium }}
          RECENT_POSTS_MAX: ${{ steps.run_options.outputs.recent_posts_max }}
          TWEET_ID_1: ${{ steps.run_options.outputs.tweet_id_1 }}
          TWEET_ID_2: ${{ steps.run_options.outputs.tweet_id_2 }}
        run: |
          New-Item -ItemType Directory -Force tmp\diagnostics | Out-Null
          New-Item -ItemType File -Force tmp\diagnostics\account-score-history.jsonl | Out-Null
          $extraArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:TWEET_ID_1)) {
            $extraArgs += @("--tweet-id", $env:TWEET_ID_1)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:TWEET_ID_2)) {
            $extraArgs += @("--tweet-id", $env:TWEET_ID_2)
          }
          .\python\.venv\Scripts\python.exe python\twitter_account_diagnostic.py `
            --diagnostics-dir tmp\diagnostics `
            --summary-output tmp\diagnostics\account-score.json `
            --history-path tmp\diagnostics\account-score-history.jsonl `
            --recent-post-limit "$env:RECENT_POSTS_MAX" `
            --assume-premium "$env:ASSUME_PREMIUM" `
            @extraArgs

      - name: Write diagnostic summary
        if: always()
        run: |
          @'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          diagnostic_path = Path("tmp/diagnostics/account-score.json")
          lines = ["## Twitter account diagnostic", ""]

          if not diagnostic_path.exists():
              lines.append("diagnostic summary file was not created.")
          else:
              payload = json.loads(diagnostic_path.read_text(encoding="utf-8"))
              lines.append(f"- Status: `{payload.get('status', 'unknown')}`")
              if payload.get("status") != "ok":
                  if payload.get("error"):
                      lines.append(f"- Error: `{payload.get('error')}`")
              else:
                  score = ((payload.get("score_prediction") or {}).get("score"))
                  distribution = ((payload.get("score_prediction") or {}).get("distribution"))
                  components = ((payload.get("score_prediction") or {}).get("components") or {})
                  metrics = ((payload.get("score_prediction") or {}).get("metrics") or {})
                  lines.extend(
                      [
                          f"- Username: `{payload.get('username', '')}`",
                          f"- Name: `{payload.get('name', '')}`",
                          f"- User ID: `{payload.get('user_id', '')}`",
                          f"- Run at JST: `{payload.get('run_at_jst', '')}`",
                          f"- Predicted score: `{score}`",
                          f"- Distribution: `{distribution}`",
                          f"- Assume Premium: `{payload.get('assume_premium')}`",
                          f"- History entries: `{payload.get('history_length', '')}`",
                          "",
                          "### Component breakdown",
                          "",
                      ]
                  )
                  for key, value in components.items():
                      lines.append(f"- `{key}`: `{value}`")
                  lines.extend(
                      [
                          "",
                          "### Metrics",
                          "",
                          f"- Followers: `{metrics.get('followers', '')}`",
                          f"- Following: `{metrics.get('following', '')}`",
                          f"- Account age days: `{metrics.get('account_age_days', '')}`",
                          f"- Posts last 24h: `{metrics.get('posts_last_24h', '')}`",
                           f"- Posts last 7d: `{metrics.get('posts_last_7d', '')}`",
                           f"- Posts/day (7d avg): `{metrics.get('posts_per_day_7d', '')}`",
                           f"- Avg views/follower: `{metrics.get('average_view_per_follower', '')}`",
                           f"- Avg interaction rate: `{metrics.get('average_interaction_rate', '')}`",
                           f"- Avg engagement signal rate: `{metrics.get('average_engagement_signal_rate', '')}`",
                       ]
                   )
                  warnings = (payload.get("score_prediction") or {}).get("warnings") or []
                  suggestions = (payload.get("score_prediction") or {}).get("suggestions") or []
                  previews = payload.get("recent_post_preview") or []
                  lookups = payload.get("tweet_lookups") or []
                  if warnings:
                      lines.extend(["", "### Warnings", ""])
                      for warning in warnings:
                          lines.append(f"- {warning}")
                  if suggestions:
                      lines.extend(["", "### Suggestions", ""])
                      for suggestion in suggestions:
                          lines.append(f"- {suggestion}")
                  if previews:
                      lines.extend(["", "### Recent posts", "", "| ID | Created | Views | Text |", "| --- | --- | --- | --- |"])
                      for item in previews:
                          text = str(item.get("text_snippet") or "").replace("|", "\\|")
                          lines.append(
                              f"| `{item.get('id', '')}` | `{item.get('created_at', '')}` | `{item.get('views', '')}` | {text} |"
                          )
                  if lookups:
                      lines.extend(["", "### Tweet ID lookup", ""])
                      for item in lookups:
                          lines.append(f"- `{item.get('tweet_id', '')}`: `{'ok' if item.get('ok') else 'failed'}`")
                          if item.get("text"):
                              lines.append(f"  - Text: {str(item.get('text'))[:180]}")
                          if item.get("error"):
                              lines.append(f"  - Error: {item.get('error')}")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          '@ | .\python\.venv\Scripts\python.exe -

      - name: Save score history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tmp/diagnostics/account-score-history.jsonl
          key: ${{ runner.os }}-twitter-account-score-history-${{ github.run_id }}

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitter-diagnostic
          path: tmp/diagnostics/
          if-no-files-found: ignore
