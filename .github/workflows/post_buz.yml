name: Post buz

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in preview mode without posting
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 23 * * *"
    - cron: "30 3 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: post-buz
  cancel-in-progress: false

jobs:
  run:
    runs-on:
      - self-hosted
      - windows-wsl
    defaults:
      run:
        shell: bash
    env:
      CATEGORY: buz
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate posting window
        id: posting_window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sys.path.append(str(Path.cwd() / "scripts" / "lib"))
          from posting_window import should_run_in_posting_window

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              should_run = True
          else:
              should_run = should_run_in_posting_window(
                  now,
                  allowed_times=[(8, 0), (12, 30), (21, 0)],
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"should_run={str(should_run).lower()}\n")
              handle.write(f"now_jst={now.isoformat()}\n")
          PY

      - name: Install runtime dependencies
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install pyyaml twitter-cli googletrans==4.0.0rc1
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            mkdir -p python/.venv/bin
            cat > python/.venv/bin/python <<'EOF'
            #!/usr/bin/env bash
            exec "$(dirname "$0")/../Scripts/python.exe" "$@"
            EOF
            cat > python/.venv/bin/pip <<'EOF'
            #!/usr/bin/env bash
            exec "$(dirname "$0")/../Scripts/pip.exe" "$@"
            EOF
            cat > python/.venv/bin/twitter <<'EOF'
            #!/usr/bin/env bash
            exec "$(dirname "$0")/../Scripts/twitter.exe" "$@"
            EOF
            chmod +x python/.venv/bin/python python/.venv/bin/pip python/.venv/bin/twitter
          fi

      - name: Load account mode
        id: account_mode
        if: steps.posting_window.outputs.should_run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          def parse_bool(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str) and value.strip().lower() in {"true", "false"}:
                  return value.strip().lower() == "true"
              raise SystemExit("dry_run must be a boolean")

          category = os.environ["CATEGORY"]
          event_name = os.environ["EVENT_NAME"]
          inputs = json.loads(os.environ.get("EVENT_INPUTS_JSON") or "{}") or {}
          raw = yaml.safe_load(Path("config/accounts.yaml").read_text(encoding="utf-8")) or {}
          defaults = raw.get("defaults") or {}
          accounts = raw.get("accounts") or {}
          account = accounts.get(category) or {}
          manual_override = ""
          if event_name == "workflow_dispatch":
              manual_override = str(inputs.get("dry_run", "")).strip().lower()
          if manual_override:
              dry_run = parse_bool(manual_override)
          else:
              dry_run = parse_bool(account.get("dry_run", defaults.get("dry_run", True)))

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"dry_run={str(dry_run).lower()}\n")
          PY

      - name: Run runtime diagnostics
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          mkdir -p tmp
          python/.venv/bin/python python/check_python_runtime.py --module yaml --output tmp/buz-runtime.json

      - name: Prepare scripts
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          chmod +x scripts/*.sh scripts/lib/common.sh
          mkdir -p tmp/state

      - name: Restore post state
        if: steps.posting_window.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tmp/state
          key: ${{ runner.os }}-post-buz-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-post-buz-state-

      - name: Hourly post guard
        id: hourly_guard
        if: steps.posting_window.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sys.path.append(str(Path.cwd() / "scripts" / "lib"))
          from hourly_post_guard import check_hourly_guard

          category = os.environ["CATEGORY"]
          dry_run = os.environ.get("DRY_RUN", "true").strip().lower() == "true"
          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          state_path = Path("tmp/state") / f"hourly-{category}.json"
          runs_dir = Path("tmp/runs")
          runs_dir.mkdir(parents=True, exist_ok=True)

          if dry_run:
              result = {"allowed": True, "jst_hour": now.strftime("%Y-%m-%dT%H"), "dry_run": True}
          else:
              result = check_hourly_guard(state_path, now)

          guard_path = runs_dir / f"hourly-guard-{category}.json"
          guard_path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"allowed={str(result['allowed']).lower()}\n")
          PY
        env:
          DRY_RUN: ${{ steps.account_mode.outputs.dry_run }}

      - name: Fetch candidates and process mode
        if: steps.posting_window.outputs.should_run == 'true' && steps.hourly_guard.outputs.allowed == 'true'
        run: bash scripts/fetch_and_post.sh --category "${CATEGORY}" --dry-run "${{ steps.account_mode.outputs.dry_run }}"

      - name: Record hourly post
        if: steps.posting_window.outputs.should_run == 'true' && steps.hourly_guard.outputs.allowed == 'true' && steps.account_mode.outputs.dry_run != 'true'
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os

          sys.path.append(str(Path.cwd() / "scripts" / "lib"))
          from hourly_post_guard import record_hourly_post

          category = os.environ["CATEGORY"]
          runs_dir = Path("tmp/runs")

          # Only record if an actual post was made (result_mode == "posted").
          candidate_files = sorted(runs_dir.glob(f"candidate-{category}.*"))
          candidate_files = [f for f in candidate_files if not f.name.endswith(".tmp")]
          if not candidate_files:
              print("No candidate file found; skipping hourly record.")
              raise SystemExit(0)
          try:
              payload = json.loads(candidate_files[-1].read_text(encoding="utf-8"))
              if str(payload.get("result_mode") or "") != "posted":
                  print(f"result_mode={payload.get('result_mode')}; skipping hourly record.")
                  raise SystemExit(0)
          except (json.JSONDecodeError, OSError) as exc:
              print(f"Cannot read candidate file: {exc}; skipping hourly record.")
              raise SystemExit(0)

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          state_path = Path("tmp/state") / f"hourly-{category}.json"
          record_hourly_post(state_path, now)
          PY

      - name: Write run summary
        if: always()
        env:
          POSTING_WINDOW: ${{ steps.posting_window.outputs.should_run }}
          POSTING_WINDOW_JST: ${{ steps.posting_window.outputs.now_jst }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.append(str(Path.cwd() / "scripts" / "lib"))

          from workflow_summary import load_latest_candidate_payload, render_run_summary

          category = os.environ["CATEGORY"]
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          candidate_files = sorted(Path("tmp/runs").glob(f"candidate-{category}.*"))
          posting_window = os.environ.get("POSTING_WINDOW", "")
          posting_window_jst = os.environ.get("POSTING_WINDOW_JST", "")

          payload = None
          candidate_error = None
          if candidate_files:
              payload, candidate_error = load_latest_candidate_payload(candidate_files)

          reply_result = None
          reply_result_path = Path("tmp/runs") / f"reply-{category}.json"
          if reply_result_path.is_file():
              try:
                  reply_result = json.loads(reply_result_path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          hourly_guard = None
          hourly_guard_path = Path("tmp/runs") / f"hourly-guard-{category}.json"
          if hourly_guard_path.is_file():
              try:
                  hourly_guard = json.loads(hourly_guard_path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          lines = render_run_summary(
              category=category,
              posting_window=posting_window,
              posting_window_jst=posting_window_jst,
              payload=payload,
              candidate_error=candidate_error,
              reply_result=reply_result,
              hourly_guard=hourly_guard,
          )

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Save post state
        if: always() && steps.posting_window.outputs.should_run == 'true' && steps.account_mode.outputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/state
          key: ${{ runner.os }}-post-buz-state-${{ github.run_id }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buz-run
          path: tmp/
          if-no-files-found: ignore
