name: TikTok anonymization

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: TikTok video URL
        required: true
        type: string
      force:
        description: Reprocess an existing video
        required: true
        default: false
        type: boolean
      reference_audio_url:
        description: Optional TikTok URL used to extract replacement audio
        required: false
        default: ""
        type: string
      similarity_variant:
        description: Apply mirror, 0.8x, dark grade, and bottom mosaic before face overlay
        required: true
        default: true
        type: boolean
      variant_speed:
        description: Playback speed used for the similarity variant
        required: true
        default: "0.8"
        type: string
      variant_mosaic_bottom_ratio:
        description: Bottom-area mosaic coverage ratio for the similarity variant
        required: true
        default: "0.35"
        type: string
      stamp_type:
        description: Stamp asset identifier
        required: true
        default: default
        type: string
      stamp_scale:
        description: Face stamp scale
        required: true
        default: "1.6"
        type: string

permissions:
  contents: read

concurrency:
  group: tiktok-anonymization
  cancel-in-progress: false

jobs:
  run:
    runs-on:
      - self-hosted
      - windows-wsl
      - tiktok-video
    env:
      RAW_EXPORT_DIR: ${{ vars.TIKTOK_EXPORT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate export directory
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAW_EXPORT_DIR)) {
            throw "Repository variable TIKTOK_EXPORT_DIR is required."
          }
          if (-not (Test-Path $env:RAW_EXPORT_DIR)) {
            New-Item -ItemType Directory -Force -Path $env:RAW_EXPORT_DIR | Out-Null
          }

      - name: Resolve Python bootstrap
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Users\szk\AppData\Local\Programs\Python\Python310\python.exe",
            "C:\Users\szk\miniconda3\python.exe"
          )
          $pythonExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pythonExe) {
            throw "No usable Python bootstrap interpreter was found on the runner."
          }
          "PYTHON_BOOTSTRAP=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare ffmpeg
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ffmpeg) {
            "FFMPEG_BIN=$($ffmpeg.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpegExe) {
            throw "ffmpeg.exe was not found after archive extraction."
          }
          $ffmpegDir = Split-Path -Parent $ffmpegExe
          "FFMPEG_BIN=$ffmpegExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$ffmpegDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Python runtime
        shell: pwsh
        run: |
          & "$env:PYTHON_BOOTSTRAP" -m venv python\.venv
          $venvPython = Join-Path $PWD "python\.venv\Scripts\python.exe"
          & $venvPython -m pip install --upgrade pip
          & $venvPython -m pip install pyyaml pillow numpy yt-dlp opencv-python-headless

      - name: Run TikTok anonymization pipeline
        shell: pwsh
        env:
          INPUT_URL: ${{ inputs.tiktok_url }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_REFERENCE_AUDIO_URL: ${{ inputs.reference_audio_url }}
          INPUT_SIMILARITY_VARIANT: ${{ inputs.similarity_variant }}
          INPUT_VARIANT_SPEED: ${{ inputs.variant_speed }}
          INPUT_VARIANT_MOSAIC_BOTTOM_RATIO: ${{ inputs.variant_mosaic_bottom_ratio }}
          INPUT_STAMP_TYPE: ${{ inputs.stamp_type }}
          INPUT_STAMP_SCALE: ${{ inputs.stamp_scale }}
        run: |
          $venvPython = Join-Path $PWD "python\.venv\Scripts\python.exe"
          $args = @(
            "scripts/tiktok/run_anonymization_pipeline.py"
            "--url"
            "$env:INPUT_URL"
            "--output-root"
            "tmp/tiktok-pipeline"
            "--export-dir"
            "$env:RAW_EXPORT_DIR"
            "--variant-speed"
            "$env:INPUT_VARIANT_SPEED"
            "--variant-mosaic-bottom-ratio"
            "$env:INPUT_VARIANT_MOSAIC_BOTTOM_RATIO"
            "--stamp-type"
            "$env:INPUT_STAMP_TYPE"
            "--stamp-scale"
            "$env:INPUT_STAMP_SCALE"
            "--log-level"
            "INFO"
          )
          if (-not [string]::IsNullOrWhiteSpace("$env:INPUT_REFERENCE_AUDIO_URL")) {
            $args += @("--reference-audio-url", "$env:INPUT_REFERENCE_AUDIO_URL")
          }
          if ("$env:INPUT_SIMILARITY_VARIANT" -ne "true") {
            $args += "--disable-similarity-variant"
          }
          if ("$env:INPUT_FORCE" -eq "true") {
            $args += "--force"
          }
          & $venvPython @args

      - name: Write GitHub Actions summary
        if: always()
        shell: pwsh
        run: |
          $venvPython = Join-Path $PWD "python\.venv\Scripts\python.exe"
          if (Test-Path "tmp/tiktok-pipeline/latest-result.json") {
            & $venvPython scripts/tiktok/write_actions_summary.py --result-json "tmp/tiktok-pipeline/latest-result.json" --summary-path "$env:GITHUB_STEP_SUMMARY"
          } else {
            @(
              '## TikTok anonymization run'
              ''
              '- Result: `error`'
              '- Failure reason: `result file missing`'
            ) | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload TikTok pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-anonymization
          path: |
            tmp/tiktok-pipeline/
          if-no-files-found: ignore
