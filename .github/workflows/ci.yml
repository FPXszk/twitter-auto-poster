name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on:
      - self-hosted
      - Windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml yfinance pandas xlrd numpy pillow twitter-cli twikit==2.3.3 XClientTransaction==1.0.2

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate shell scripts
        run: |
          $bashCandidates = @(
            "C:\Program Files\Git\bin\bash.exe",
            "C:\Program Files\Git\usr\bin\bash.exe"
          )
          $bash = $bashCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bash) {
            $bash = (Get-Command bash -ErrorAction SilentlyContinue).Source
          }
          if (-not $bash) {
            throw "bash was not found on PATH; install Git Bash or migrate the remaining shell scripts first."
          }
          if ($bash -like "*\Windows\system32\bash.exe") {
            throw "Refusing WSL bash for Windows native validation; install Git Bash or migrate the remaining shell scripts first."
          }

          $shellFiles = Get-ChildItem scripts -Recurse -File -Filter *.sh | Sort-Object FullName
          if (-not $shellFiles) {
            throw "No shell scripts found."
          }

          & $bash -n @($shellFiles.FullName)

      - name: Validate Python modules
        run: |
          $pythonFiles = @(
            Get-ChildItem python, scripts/lib -Recurse -File -Filter *.py |
              Where-Object { $_.FullName -notmatch "\\\.venv\\" } |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          if (-not $pythonFiles) {
            throw "No Python files found."
          }

          python -m py_compile @pythonFiles

      - name: Validate YAML files
        run: python scripts/dev/validate_yaml.py
