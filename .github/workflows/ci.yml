name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml yfinance pandas xlrd twitter-cli twikit==2.3.3 XClientTransaction==1.0.2

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(find scripts -type f -name '*.sh' | sort)
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell scripts found." >&2
            exit 1
          fi
          bash -n "${shell_files[@]}"

      - name: Validate Python modules
        run: |
          set -euo pipefail
          mapfile -t python_files < <(find python scripts/lib -type f -name '*.py' ! -path '*/.*' ! -path '*/.venv/*' | sort)
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python files found." >&2
            exit 1
          fi
          python -m py_compile "${python_files[@]}"

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path("config").glob("*.yaml")) + sorted(Path(".github/workflows").glob("*.yml"))
          if not paths:
              raise SystemExit("No YAML files found.")

          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY
