# Source definitions for twitter-cli collection.
defaults:
  max_results: 5
  timeline: Latest
  exclude_retweets: true

sources:
  - id: buz-gorillataxjp-big
    category: buz
    type: search
    enabled: true
    query: "from:gorillataxjp -is:retweet -is:reply min_retweets:52 min_faves:3000"
    timeline: Top
    max_results: 20
    score_boost: 10

  - id: buz-gorillataxjp-small
