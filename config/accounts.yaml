# Account-specific posting policy.
# - dry_run: post_invest workflow とローカル実行の既定モードの設定元
# - state_file: 空文字なら `tmp/state/<category>-posted.txt`、相対パスなら output-dir 配下に解決
# - summary_*: 候補本文を作るときの接頭辞・言語・最大文字数
# - summary_provider: `legacy_google_translate` または `copilot_cli`
# - summary_model / summary_prompt_path: copilot provider 用のモデルと指示文
# - single_post_max_length: 単発投稿の上限。twitter-cli 実投稿経路に合わせて 280 以内
# - source_reference_mode: `url` は本文末尾に URL、`quote` は prototype の引用返信経路を使う
# - media_state_file: 画像あり/なし交互選択の state
# - filters / score_weights: 候補選定ロジックの調整点（freshness は新しい投稿ほど加点、velocity は反応速度）
#   min_author_followers / max_author_followers で極端なアカウント規模を弾き、author_virality でフォロワー比の伸びを加点する
defaults:
  dry_run: true
  post_prefix: "Auto update:"
  max_candidates: 1
  summary_prefix: "Xで反応上位: "
  summary_language: "ja"
  summary_provider: "legacy_google_translate"
  summary_model: "gpt-5-mini"
  summary_prompt_path: ""
  summary_max_length: 280
  single_post_max_length: 280
  state_file: ""
  media_state_file: ""
  selection_mode: "score"
  rotation_state_file: ""
  score_weights:
    likes: 1
    retweets: 1
    replies: 1
    views: 1
    velocity: 0
    freshness: 0
    image_bonus: 0
  filters:
    max_age_hours: 48
    required_terms: []
    exclude_keywords: []

accounts:
  buz:
    dry_run: false
    post_prefix: ""
    max_candidates: 1
    summary_prefix: ""
    summary_provider: "copilot_cli"
    summary_model: "gpt-5-mini"
    summary_prompt_path: "config/copilot_summary_prompt_ja.txt"
    summary_max_length: 280
    single_post_max_length: 280
    selection_mode: "round_robin"
    rotation_state_file: "state/buz-robin.txt"
    source_reference_mode: "url"
    state_file: "state/buz-posted.txt"
    media_state_file: "state/buz-hot-selection.json"
    score_weights:
      likes: 1.0
      retweets: 3.5
      replies: 4.5
      views: 0.015
      velocity: 2.0
      freshness: 1.5
      image_bonus: 12
      author_virality: 30
    filters:
      max_age_hours: 72
      min_author_followers: 1000
      max_author_followers: 10000000
      exclude_keywords:
        - "フォロー"
        - "プレゼント企画"
        - "キャンペーン"
        - "giveaway"
        - "airdrop"

  news:
    dry_run: true
    post_prefix: "News watch:"
    max_candidates: 1
    summary_prefix: "Xで反応上位: "
    summary_provider: "copilot_cli"
    summary_model: "gpt-5-mini"
    summary_prompt_path: "config/copilot_summary_prompt_ja.txt"
    filters:
      max_age_hours: 48
